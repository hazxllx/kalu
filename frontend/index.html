<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#072F5F" />
    <meta
      name="description"
      content="KALUSAGAP — Community Health Risk Monitoring and Early Intervention System. Municipal Health Office, Municipality of Pili, Camarines Sur."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" type="image/png" href="./src/assets/images/logo.png" />
    <link rel="apple-touch-icon" href="./src/assets/images/logo.png" />
    <title>KALUSAGAP — Municipal Health Office | Pili, Camarines Sur</title>
    <script>
      // Apply the saved theme before first paint to avoid any light/dark flash.
      // Light Mode is the default — the OS preference is never used unless the
      // user explicitly chose "system".
      (function () {
        try {
          var stored = localStorage.getItem('kalusagap.theme');
          var dark = false;
          if (stored === 'dark') dark = true;
          else if (stored === 'system') dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          // no saved preference → Light (dark stays false)
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
